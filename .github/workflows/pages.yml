name: Deploy project journey

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'project-status.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate project status and public assets
        run: node site/scripts/validate-site.mjs --base-path /social-deduction-ai/
      - name: Build static Pages files
        run: node site/scripts/build-site.mjs "$RUNNER_TEMP/site-build"
      - name: Validate the production-shaped artifact
        run: node site/scripts/validate-site.mjs --base-path /social-deduction-ai/ --root "$RUNNER_TEMP/site-build"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site-build
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      - name: Publish reviewed main artifact
        id: deployment
        uses: actions/deploy-pages@v5
